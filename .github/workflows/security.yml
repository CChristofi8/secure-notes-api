name: Security pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment), not mutable
      # tags, so a repointed tag cannot inject code into this pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, needed for secrets scanning

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (including access control tests)
        run: pytest -v

      # Security tools run in their own virtual environments so they cannot
      # change the application's dependency versions.
      - name: SAST with Semgrep
        run: |
          python -m venv /tmp/semgrep
          /tmp/semgrep/bin/pip install -q semgrep
          /tmp/semgrep/bin/semgrep scan --config p/python --config p/owasp-top-ten --error

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          python -m venv /tmp/pip-audit
          /tmp/pip-audit/bin/pip install -q pip-audit
          /tmp/pip-audit/bin/pip-audit -r requirements.txt

      - name: Secrets scan (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (CycloneDX)
        run: |
          python -m venv /tmp/cyclonedx
          /tmp/cyclonedx/bin/pip install -q cyclonedx-bom
          /tmp/cyclonedx/bin/cyclonedx-py requirements requirements.txt --of JSON -o sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json

      # DAST: start the API and scan it while it runs, using its OpenAPI
      # definition. The scan sends Bob's demo token so it tests the
      # authenticated endpoints, not just the 401 responses.
      - name: Start API for DAST
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/openapi.json > /dev/null && exit 0
            sleep 1
          done
          echo "API did not start"; cat uvicorn.log; exit 1

      - name: DAST with OWASP ZAP (API scan)
        run: |
          mkdir -p zap && chmod 777 zap
          # ZAP image pinned by digest (zaproxy/zaproxy:stable on 2026-10-05).
          # -I: report warnings without failing the build; real failures still fail.
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-api-scan.py -t http://localhost:8000/openapi.json -f openapi \
              -r zap-report.html -J zap-report.json -I \
              -z "-config replacer.full_list(0).description=auth \
                  -config replacer.full_list(0).enabled=true \
                  -config replacer.full_list(0).matchtype=REQ_HEADER \
                  -config replacer.full_list(0).matchstr=Authorization \
                  -config replacer.full_list(0).regex=false \
                  -config replacer.full_list(0).replacement='Bearer demo-token-bob'"

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: zap/
